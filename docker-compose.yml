services:
  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      VITE_API_MODE: ${VITE_API_MODE:-mock}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}

  web:
    build:
      context: .
      args:
        VITE_API_MODE: ${VITE_API_MODE:-mock}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:18086:80"
    profiles:
      - prod

volumes:
  node_modules:
